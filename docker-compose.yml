# Local dependencies for the job and the API: Postgres, plus SeaweedFS as an S3-compatible store standing in for OVH Object Storage.
# (MinIO no longer publishes public Docker images.)
services:
  postgres:
    image: postgres:16
    container_name: representative-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: representatives
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: representative-s3
    restart: always
    # SeaweedFS rejects signed requests unless an identity is configured, even locally.
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "9000:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data

  # Creates the raw bucket with versioning on, as it must be on OVH.
  s3-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url http://s3:8333 s3api create-bucket --bucket representative-raw || true;
             aws --endpoint-url http://s3:8333 s3api put-bucket-versioning --bucket representative-raw --versioning-configuration Status=Enabled"

volumes:
  postgres-data:
  s3-data:
