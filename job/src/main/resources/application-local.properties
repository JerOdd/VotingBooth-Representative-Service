# Postgres from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5433/representatives
spring.datasource.username=postgres
spring.datasource.password=postgres

# SeaweedFS from docker-compose.yml, with the identity declared in its s3 service
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.bucket=representative-raw
storage.access-key=local
storage.secret-key=local-secret
storage.path-style=true
